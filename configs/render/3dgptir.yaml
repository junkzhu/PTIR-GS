method: 3dgptir

pipeline_type: reference
backward_pipeline_type: ${render.pipeline_type}Bwd
particle_kernel_degree: 4
particle_kernel_density_clamping: true
particle_kernel_min_response: 0.0113
particle_kernel_min_alpha: ${div:1.0,255.0}
particle_kernel_max_alpha: 0.99
particle_radiance_sph_degree: 3
primitive_type: instances
min_transmittance: 0.001
max_self_occlusion_offset: 0.1
max_consecutive_bvh_update: 15
visualize_lights: false
enable_normals: true
enable_hitcounts: true
enable_mis: true
enable_secondary_nee: true # Enable NEE at all path vertices after the primary camera hit
discrete_model: false # Use stochastic discrete Gaussian surface interactions
filter_type: atrous #support "none", "atrous"
enable_metallic: ${model.optimize_material_metallic}
enable_kernel_timings: false
hide_intermediate_outputs: false
russian_roulette: false
spp_chunk: 32

# Inversion settings
max_bounces: 3
inversion_spp: 32

# Rendering and relighting settings
render_bounces: 3
render_spp: 128
relight_spp: 512
